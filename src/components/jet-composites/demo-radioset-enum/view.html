<oj-radioset value="{{$properties.value}}"
  :class="[[$properties.direction === 'row' ? 'oj-choice-direction-row' : '']]"
  label-hint="[[$properties.labelHint]]"
  labelled-by="[[$properties.labelledBy]]" 
  described-by="[[$properties.describedBy]]"
  aria-label="Choose only one setting."
  disabled="[[$properties.disabled]]">
  <oj-bind-for-each data="[[$properties.enumValues]]">
    <template>
      <oj-option value="[[$current.data]]" disabled="[[$properties.disabledValues.indexOf($current.data) !== -1]]">
        <span><oj-bind-text value="[[$current.data]]"></oj-bind-text></span>
      </oj-option>
    </template>
  </oj-bind-for-each>
</oj-radioset>
