        <oj-accordion id="accordionPageAll" multiple>
          <oj-collapsible id="recipeHeaderAll" expanded>
            <span>Recipe</span>
            <div id="recipeAll" class="componentRecipe demo-component-margin"></div>
          </oj-collapsible>
  
          <!-- ko if: application.state.htmlFile() -->						
          <oj-collapsible id="c1" expanded on-oj-expand="[[functions.refreshCodeEditor.bind($data,'#html-example-all')]]">
            <span>HTML Editor</span>
            <div class="code-editor-section">
              <div id="componentHTML_All"  dir="ltr">
                <article id="componentHTMLContent_All" class="markup-example">
                  <oj-sample-cookbook-editor id="html-example-all" source="{{application.state.htmlFile().editorSource}}"
                                   type="{{application.state.htmlFile().editorType}}"
                                   read-only="{{application.state.htmlFile().readOnly}}"
                                   read-only-lines="{{application.state.htmlFile().readOnlyLines}}"
                                   fold-lines="{{application.state.htmlFile().foldLines}}"
                                   on-source-change="{{listeners.sourceChanged.bind($data)}}"
                                   ></oj-sample-cookbook-editor>
                </article>
              </div>
            </div>
          </oj-collapsible>
          <!-- /ko -->
          
          <!-- ko if: application.state.tsFile() -->
