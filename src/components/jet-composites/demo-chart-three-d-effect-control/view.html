<oj-buttonset-one :id="[[$uniqueId + '_buttonset1']]" aria-label="Choose between 2D and 3D" disabled="[[$properties.disabled]]" focus-management="[[$properties.focusManagement]]" value="{{$properties.threeDEffect}}" chroming="borderless">
  <oj-option value="off">
    <span>2D</span>
  </oj-option>
  <oj-option value="on">
    <span>3D</span>
  </oj-option>
</oj-buttonset-one>
