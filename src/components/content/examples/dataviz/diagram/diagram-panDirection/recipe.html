<ol>
  <li>
    Restrict panning to the horizontal and vertical directions only by setting
    <i><b>pan-direction</b></i>
    attribute to
    <i>x</i>
    and
    <i>y</i>
    respectively. Setting
    <i><b>pan-direction</b></i>
    attribute to
    <i>auto</i>
    will not restrict panning.
  </li>
  <li>
    <b>Layouts</b>
    : The application is responsible for providing the layout algorithm used by the Diagram.
  </li>
</ol>
