<ol>
  <li>
    Provide nodes and links data for the component by constructing either
    <code>ArrayDataProvider</code>
    or
    <code>ArrayTreeDataProvider</code>
    objects from the arrays of data, or a JSON source.
  </li>
  <li>
    The data supplied to the data providers should be of type
    <a target="_blank" href="jsdocs/oj.ojDiagram.html#Node">ojDiagram.Node</a>
    or
    <a target="_blank" href="jsdocs/oj.ojDiagram.html#Link">ojDiagram.Link</a>
    .
  </li>
</ol>
