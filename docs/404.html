<!doctype html>
<html lang="en-us">

<head>
  <meta charset="UTF-8" />
  <title>Redirecting...</title>
  <script>
    (function () {
      var locationPath =
        window.location.pathname +
        window.location.search +
        window.location.hash;
      console.log("Location: ", locationPath);
      debugger;
      window.location.replace(
        "/?spaRedirect=" + encodeURIComponent(locationPath)
      );
    })();
  </script>
</head>

<body></body>

</html>
